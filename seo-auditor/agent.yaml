id: seo-auditor
base_agent: antigravity-preview-05-2026
description: "Audits published web applications for loading speed, mobile usability, Core Web Vitals, and search readiness using Lighthouse, comparing Mobile vs Desktop strategies side-by-side."
tools:
  - type: code_execution
  - type: google_search
environment:
  type: "remote"
  network:
    allowlist:
      - domain: "*"
examples:
  - title: "Audit Web App (Mobile & Desktop)"
    prompt: "Audit https://web.dev and produce a side-by-side Mobile vs Desktop Core Web Vitals and SEO performance report."
  - title: "Accessibility & ARIA Audit"
    prompt: "Audit https://ai.google.dev for accessibility and screen reader readiness, and provide code fixes for missing ARIA attributes, tap targets, and semantic structure."
  - title: "Search Indexing & SEO Audit"
    prompt: "Check search indexing status and on-page SEO readiness for https://deepmind.google including meta tags, OpenGraph preview, and crawlability."
